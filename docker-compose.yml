services:
  # ─── MongoDB ───────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: coursehust-mongodb
    volumes:
      - mongodb_data:/data/db
    networks:
      - coursehust-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ─── Backend (Node.js / Express) ───────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: coursehust-backend
    depends_on:
      mongodb:
        condition: service_healthy
    # Values come from ./.env (gitignored - copy .env.example to .env and
    # fill in real secrets). Keeping them out of this tracked file is what
    # actually stops credentials from being committed.
    env_file:
      - .env
    ports:
      - "5500:5500"
    networks:
      - coursehust-net
    restart: unless-stopped

  # ─── Frontend (React + Vite → Nginx HTTPS) ────────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Empty: Axios uses relative paths, Nginx proxies /api → backend:5500
        VITE_BASE_URL: ""
    container_name: coursehust-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - coursehust-net
    restart: unless-stopped

volumes:
  mongodb_data:
    name: coursehust-mongodb-data

networks:
  coursehust-net:
    driver: bridge
